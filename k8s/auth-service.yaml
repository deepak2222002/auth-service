apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service

          image: deepak2222002/auth-service:1.0

          ports:
            - containerPort: 8091

          env:
            - name: CORS_ALLOWED_ORIGINS
              value: "https://192.168.31.184:8090"

            - name: DB_URL
              value: "jdbc:sqlserver://sqlserver:1433;databaseName=jobportal;trustServerCertificate=true"

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD

            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service

spec:
  selector:
    app: auth-service

  ports:
    - protocol: TCP
      port: 8091
      targetPort: 8091

  type: ClusterIP